name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubicloud-standard-2-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Repository standard tests
        run: node --test --test-concurrency=1 scripts/*pr-standard.test.mjs scripts/worktree/*.test.mjs

      - name: Validate actual PR metadata (read-only)
        if: github.event_name == 'pull_request'
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          import { validatePullRequest } from './scripts/pr-standard.mjs';
          const { pull_request: pr } = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          assert.deepEqual(validatePullRequest(pr), []);
          assert.ok(validatePullRequest({ ...pr, title: 'Missing ticket' }).length > 0);
          console.log('Actual PR metadata passes; invalid-title copy fails. No metadata writes.');
          NODE

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build smoke test
        run: |
          bun build --compile ./src/index.ts --outfile finch
          ./finch auth status --json
          ./scripts/verify-auth-callback-server.sh

      - name: Regression checklist
        run: ./scripts/regression-checklist.sh

  quality:
    name: Repository quality gates
    needs: verify
    if: ${{ always() }}
    runs-on: ubicloud-standard-2-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Require all repository checks to succeed
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          if [ "$VERIFY_RESULT" != success ]; then
            echo "Repository verification did not succeed: $VERIFY_RESULT"
            exit 1
          fi
          echo 'Repository standards, metadata, typecheck, tests, build and regression checks passed.'
